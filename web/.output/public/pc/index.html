<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7B1FA2">
<title>HeartChain - 连接每一份爱心（PC版）</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#7B1FA2;--primary-dark:#6A1B9A;--primary-light:#AB47BC;
  --accent:#FFB300;--dark:#1A1A2E;--bg:#FAF5FF;--card:#fff;
  --text:#333;--text2:#888;--green:#4CAF50;--red:#F44336;--yellow:#FFB300;
}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* 顶部导航 */
.topbar{background:var(--dark);color:#fff;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.topbar .logo em{font-style:normal;font-size:28px}
.topbar .logo strong{font-size:20px;font-weight:700}
.topbar .nav{display:flex;gap:32px;align-items:center}
.topbar .nav a{color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;font-weight:500}
.topbar .nav a:hover,.topbar .nav a.on{color:#fff}
.topbar .user-area{display:flex;align-items:center;gap:12px}
.topbar .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer}
.topbar .btn-log{padding:8px 20px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;text-decoration:none}

/* 主布局 */
.main{display:flex;max-width:1200px;margin:24px auto;gap:24px;padding:0 24px}
.content{flex:1;min-width:0}
.sidebar{width:300px;flex-shrink:0}

/* 卡片 */
.card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* 成就横幅 */
.ach-banner{background:linear-gradient(135deg,var(--dark),#16213E);border-radius:20px;padding:32px;color:#fff;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
.ach-info h2{font-size:14px;opacity:.7;margin-bottom:8px}
.ach-info .big{font-size:48px;font-weight:800;margin-bottom:4px}
.ach-info .sub{font-size:14px;opacity:.7}
.ach-stats{display:flex;gap:40px}
.ach-stat{text-align:center}
.ach-stat .num{font-size:28px;font-weight:700}
.ach-stat .label{font-size:11px;opacity:.6;margin-top:4px}

/* 地图 */
.map-card{border-radius:20px;height:280px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);position:relative;overflow:hidden;margin-bottom:24px;display:flex;align-items:center;justify-content:center}
.map-card .map-r{position:absolute;border-radius:50%;border:2px solid rgba(76,175,80,.2)}
.map-card .map-m{position:absolute;font-size:28px;transform:translate(-50%,-50%)}

/* 任务筛选 */
.filter-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.filter-btn.on{background:var(--primary);color:#fff}
.filter-btn.off{background:#f0f0f0;color:#666}

/* 任务列表 */
.task-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.task-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:transform .1s}
.task-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.task-card:active{transform:scale(.98)}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.task-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.task-icon.purple{background:#F3E5F5}
.task-icon.blue{background:#E3F2FD}
.task-icon.green{background:#E8F5E9}
.task-card .urgent{background:#F44336;color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.task-ok{color:var(--green);font-size:11px;font-weight:600}
.task-title{font-size:16px;font-weight:600;color:var(--dark);margin-bottom:8px}
.task-meta{font-size:12px;color:var(--text2);display:flex;gap:16px;margin-bottom:12px}
.task-meta u{color:var(--red);font-weight:600;text-decoration:none}
.task-bottom{display:flex;justify-content:space-between;align-items:center}
.task-points{font-size:12px;color:var(--text2)}
.task-points strong{color:var(--primary);font-size:14px}
.btn-help{padding:8px 20px;border-radius:20px;background:linear-gradient(135deg,var(--green),#388E3C);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer}
.btn-help:hover{opacity:.9}

/* 侧边栏 */
.side-card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.side-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.side-btn{width:100%;padding:12px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.side-btn.p{background:linear-gradient(135deg,var(--accent),#FF8F00);color:#fff}
.side-btn.s{background:#f5f5f5;color:#666}
.side-stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.side-stat:last-child{border:none}
.side-stat .val{font-weight:600;color:var(--dark)}

/* 等级 */
.level-bar{background:#f0f0f0;border-radius:10px;height:8px;overflow:hidden;margin:8px 0}
.level-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.level-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}

/* 徽章 */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;padding:8px 4px}
.badge-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 6px}
.badge-icon.on{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.badge-icon.off{opacity:.3;filter:grayscale(1);background:#e0e0e0!important}
.badge-name{font-size:10px;color:var(--text2);line-height:1.3}

/* 底部 */
.footer{text-align:center;padding:32px;color:var(--text2);font-size:12px}

/* 浮动按钮 */
.fab{position:fixed;bottom:32px;right:32px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#FF8F00);color:#fff;font-size:30px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(255,179,0,.4);display:flex;align-items:center;}
.fab:hover{transform:scale(1.05)}
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
  <a href="/" class="logo"><em>❤️</em><strong>HeartChain</strong></a>
  <nav class="nav">
    <a href="/" class="on">首页</a>
    <a href="/tasks/index.html">任务大厅</a>
    <a href="/achievement.html">成就</a>
    <a href="/wallet.html">钱包</a>
  </nav>
  <div class="user-area" id="authArea"></div>
</header>

<!-- 主内容 -->
<div class="main">
  <div class="content">
    <!-- 成就横幅 -->
    <div class="ach-banner">
      <div class="ach-info">
        <h2>🏆 本月成就</h2>
        <div class="big" id="achPoints">—</div>
        <div class="sub">❤️ 爱心积分</div>
      </div>
      <div class="ach-stats" id="achStats" style="display:none">
        <div class="ach-stat"><div class="num" id="stHelps">0</div><div class="label">本月帮助</div></div>
        <div class="ach-stat"><div class="num" id="stPts">0</div><div class="label">总积分</div></div>
        <div class="ach-stat"><div class="num">#3</div><div class="label">排名</div></div>
      </div>
    </div>

    <!-- 地图 -->
    <div class="map-card">
      <div class="map-r" style="width:160px;height:160px;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
      <div class="map-r" style="width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
      <div class="map-m" style="top:35%;left:40%">📍</div>
      <div class="map-m" style="top:55%;left:55%">📌</div>
      <div class="map-m" style="top:25%;left:65%">📌</div>
      <div class="map-m" style="top:60%;left:35%">📌</div>
      <div style="position:absolute;bottom:12px;right:12px;background:rgba(255,255,255,.9);padding:6px 14px;border-radius:10px;font-size:12px;color:#666">🗺️ 附近 4 个求助</div>
    </div>

    <!-- 任务筛选 -->
    <div class="filter-row">
      <button class="filter-btn on">📍 5km</button>
      <button class="filter-btn on">⏰ 2h内</button>
      <button class="filter-btn off">🛒 跑腿</button>
      <button class="filter-btn off">🚗 搬运</button>
      <button class="filter-btn off">📱 教学</button>
      <button class="filter-btn off">🐕 宠物</button>
      <button class="filter-btn off">🔧 维修</button>
      <button class="filter-btn off">📦 快递</button>
    </div>

    <!-- 任务列表 -->
    <div class="task-grid" id="taskGrid"></div>
  </div>

  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="side-card">
      <div class="side-title">⚡ 快捷操作</div>
      <button class="side-btn p" onclick="location.href='/tasks/publish.html'">📝 发布求助</button>
      <button class="side-btn s" onclick="location.href='/mytasks.html'">📋 我的任务</button>
      <button class="side-btn s" onclick="location.href='/admin/index.html'">⚙️ 管理后台</button>
    </div>

    <div class="side-card">
      <div class="side-title">📊 本月统计</div>
      <div class="side-stat"><span>帮助次数</span><span class="val">12</span></div>
      <div class="side-stat"><span>获得积分</span><span class="val">+2,400 ❤️</span></div>
      <div class="side-stat"><span>平均评分</span><span class="val">4.9 ⭐</span></div>
      <div class="side-stat"><span>月度排名</span><span class="val">#3</span></div>
    </div>

    <div class="side-card">
      <div class="side-title">🏅 会员等级</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span style="font-weight:700;color:var(--primary)">Lv.3 热心市民</span>
        <span style="color:var(--text2)">Lv.4 爱心使者</span>
      </div>
      <div class="level-bar"><div class="level-fill" style="width:65%"></div></div>
      <div class="level-labels"><span>12,400</span><span>20,000</span></div>
    </div>

    <div class="side-card">
      <div class="side-title">🏆 成就徽章</div>
      <div class="badge-grid">
        <div class="badge"><div class="badge-icon on" style="background:linear-gradient(135deg,#FFD700,#FFA000)">🌟</div><div class="badge-name">首次帮助</div></div>
        <div class="badge"><div class="badge-icon on" style="background:linear-gradient(135deg,#4CAF50,#8BC34A)">🌱</div><div class="badge-name">连续7天</div></div>
        <div class="badge"><div class="badge-icon on" style="background:linear-gradient(135deg,#2196F3,#03A9F4)">💎</div><div class="badge-name">帮助10次</div></div>
        <div class="badge"><div class="badge-icon on" style="background:linear-gradient(135deg,#E91E63,#F06292)">❤️</div><div class="badge-name">爱心大使</div></div>
        <div class="badge"><div class="badge-icon on" style="background:linear-gradient(135deg,#9C27B0,#BA68C8)">🔥</div><div class="badge-name">月度Top10</div></div>
        <div class="badge"><div class="badge-icon on" style="background:linear-gradient(135deg,#FF5722,#FF8A65)">⚡</div><div class="badge-name">闪电响应</div></div>
        <div class="badge"><div class="badge-icon off" style="background:#e0e0e0">🔒</div><div class="badge-name">???</div></div>
        <div class="badge"><div class="badge-icon off" style="background:#e0e0e0">🔒</div><div class="badge-name">???</div></div>
      </div>
    </div>
  </div>
</div>

<button class="fab" onclick="location.href='/tasks/publish.html'">＋</button>

<div class="footer">
  <p>❤️ HeartChain — 连接每一份爱心 | Copyright © 2026</p>
</div>

<script>
// 任务数据
var tasks=[
  {id:1,icon:'🛒',iconBg:'#F3E5F5',title:'帮忙买药',desc:'할머니 댁에 약을 사다 드려야 합니다. 약국은 역삼동 하나로약국입니다.',dist:0.8,addr:'서울시 강남구 역삼동',dl:20,pts:200,rwd:5000},
  {id:2,icon:'🚗',iconBg:'#E3F2FD',title:'帮忙搬行李',desc:'이사 짐을 옮겨야 하는데 혼자서 너무 무거워서 도움을 요청합니다.',dist:1.2,addr:'서울시 강남구 삼성동',dl:50,pts:350,rwd:10000},
  {id:3,icon:'📱',iconBg:'#E8F5E9',title:'教老人用手机',desc:'어머니가 스마트폰을 못 쓰셔서, 카카오톡 보내는 법 좀 가르쳐 주세요.',dist:2.5,addr:'서울시 서초구 반포동',dl:120,pts:150,rwd:0},
  {id:4,icon:'🐕',iconBg:'#FFF3E0',title:'帮忙遛狗',desc:'오늘 갑자기 일이 생겨서 산책을 시켜드리지 못합니다. 골든리트리버 1마리입니다.',dist:3.1,addr:'서울시 강남구 청담동',dl:180,pts:100,rwd:3000},
];
function renderTasks(){
  document.getElementById('taskGrid').innerHTML=tasks.map(t=>`
    <div class="task-card" onclick="alert('任务详情 ID:${t.id}')">
      <div class="task-top">
        <div class="task-icon" style="background:${t.iconBg}">${t.icon}</div>
        ${t.dl<=30?'<span class="urgent">⏰ 紧急</span>':''}
      </div>
      <div class="task-title">${t.title}</div>
      <div class="task-meta"><span>📍 ${t.dist}km</span><span class="${t.dl<=30?'u':''}">⏰ ${t.dl}分钟后</span></div>
      <div class="task-bottom">
        <div class="task-points">❤️ <strong>+${t.pts}</strong> 积分${t.rwd>0?` · ₩${t.rwd.toLocaleString()}`:''}</div>
        <button class="btn-help" onclick="event.stopPropagation();alert('已接单：${t.title}')">我来帮助</button>
      </div>
    </div>
  `).join('');
}

// 登录状态
function checkAuth(){
  var auth=localStorage.getItem('hc_auth');
  var area=document.getElementById('authArea');
  if(auth){
    try{
      var u=JSON.parse(auth).user;
      area.innerHTML=`<button class="avatar" onclick="alert('用户菜单')">${(u.name||'U').charAt(0)}</button><a href="/profile/index.html" style="color:rgba(255,255,255,.8);text-decoration:none;font-size:13px">${u.name||'用户'}</a>`;
      document.getElementById('achPoints').textContent='2,400';
      document.getElementById('achStats').style.display='flex';
      document.getElementById('stHelps').textContent='12';
      document.getElementById('stPts').textContent='2,400';
    }catch(e){localStorage.removeItem('hc_auth');showLogin();}
  }else{showLogin();}
}
function showLogin(){
  area.innerHTML=`<a href="/auth/register.html" class="btn-log">登录 / 注册</a>`;
  document.getElementById('achPoints').textContent='—';
}

renderTasks();
checkAuth();
</script>
</body>
</html>
