<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7B1FA2">
<title>HeartChain - 连接每一份爱心</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#7B1FA2;--pd:#6A1B9A;--pl:#AB47BC;--a:#FFB300;--dark:#1A1A2E;--bg:#FAF5FF}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:#333;line-height:1.6;min-height:100vh}

/* PC版入口横幅 */
.pc-banner{text-align:center;padding:10px 16px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:13px}
.pc-banner a{color:var(--a);font-weight:600;text-decoration:none}

/* 顶部 */
.hd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
.hd-in{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px}
.logo{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--dark);font-size:17px;font-weight:700}
.logo em{font-style:normal;font-size:22px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pd));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer}
.btn-log{padding:5px 14px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;text-decoration:none}
.fb{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
.fb-btn{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;border:none;cursor:pointer;white-space:nowrap}
.fb-on{background:var(--p);color:#fff}
.fb-off{background:#f0f0f0;color:#666}

/* 成就 */
.ach{margin:12px;border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--dark),#16213E);color:#fff;position:relative;overflow:hidden}
.ach::before{content:'';position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08);top:-20px;right:-20px}
.ach-r{position:relative;z-index:1}
.ach-l{font-size:11px;opacity:.7;margin-bottom:4px}
.ach-n{font-size:24px;font-weight:800;margin-bottom:2px}
.ach-s{font-size:11px;opacity:.7}
.ach-st{display:flex;gap:20px;margin-top:10px}
.ach-std .n{font-size:16px;font-weight:700}
.ach-std .l{font-size:9px;opacity:.6}

/* 地图 */
.map{margin:12px;border-radius:16px;height:130px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.map-r{position:absolute;border-radius:50%;border:2px solid rgba(76,175,80,.2)}
.map-m{position:absolute;font-size:18px;transform:translate(-50%,-50%)}

/* 任务 */
.sec{padding:0 12px 12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h h3{font-size:13px;font-weight:600}
.sec-h span{font-size:10px;color:#999}
.tc{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.tc:active{transform:scale(.98)}
.tc-t{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tc-m{font-size:11px;color:#888;display:flex;gap:10px}
.tc-m u{color:#F44336;font-weight:600;text-decoration:none}
.btn-h{padding:6px 16px;border-radius:16px;background:linear-gradient(135deg,#4CAF50,#388E3C);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer}
.fab{position:fixed;bottom:20px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--a),#FF8F00);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(255,179,0,.4);display:flex;align-items:center;justify-content:center;z-index:40}
</style>
</head>
<body>

<div class="pc-banner">💻 使用电脑访问？<a href="/pc/index.html">点击查看 PC 版 →</a></div>

<header class="hd">
  <div class="hd-in">
    <a href="/" class="logo"><em>❤️</em><strong>HeartChain</strong></a>
    <div id="authArea"></div>
  </div>
  <div class="fb">
    <button class="fb-btn fb-on">📍 5km</button>
    <button class="fb-btn fb-on">⏰ 2h内</button>
    <button class="fb-btn fb-off">🛒 跑腿</button>
    <button class="fb-btn fb-off">🚗 搬运</button>
    <button class="fb-btn fb-off">📱 教学</button>
  </div>
</header>

<div class="ach">
  <div class="ach::before"></div>
  <div class="ach-r">
    <div class="ach-l">🏆 本月成就</div>
    <div class="ach-n" id="achPoints">—</div>
    <div class="ach-s">❤️ 爱心积分</div>
    <div class="ach-st" id="achStats" style="display:none">
      <div class="ach-std"><div class="n" id="stHelps">0</div><div class="label">本月帮助</div></div>
      <div class="ach-std"><div class="n" id="stPts">0</div><div class="label">总积分</div></div>
      <div class="ach-std"><div class="n">#3</div><div class="label">排名</div></div>
    </div>
  </div>
</div>

<div class="map">
  <div class="map-r" style="width:100px;height:100px;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
  <div class="map-r" style="width:180px;height:180px;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
  <div class="map-m" style="top:35%;left:40%">📍</div>
  <div class="map-m" style="top:55%;left:60%">📌</div>
  <div class="map-m" style="top:25%;left:70%">📌</div>
  <div style="position:absolute;bottom:6px;right:6px;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:6px;font-size:9px;color:#556b2f">🗺️ 3 个求助</div>
</div>

<div class="sec">
  <div class="sec-h"><h3>附近 <span id="tc">3</span> 个求助</h3><span>实时更新</span></div>
  <div id="taskList"></div>
</div>

<button class="fab" onclick="location.href='/tasks/publish.html'">＋</button>

<script>
var tasks=[
  {id:1,t:'🛒',title:'帮忙买药',dist:.8,addr:'역삼동',dl:20,pts:200,rwd:5000,urgent:true},
  {id:2,t:'🚗',title:'帮忙搬行李',dist:1.2,addr:'삼성동',dl:50,pts:350,rwd:10000,urgent:true},
  {id:3,t:'📱',title:'教老人用手机',dist:2.5,addr:'반포동',dl:120,pts:150,rwd:0,urgent:false},
];
function renderT(){
  document.getElementById('taskList').innerHTML=tasks.map(t=>`
    <div class="tc" onclick="alert('任务${t.id}')">
      <div class="tc-t">${t.t} ${t.title}</div>
      <div class="tc-m"><span>📍 ${t.dist}km</span><span class="${t.urgent?'u':''}">⏰ ${t.dl}分</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <span style="font-size:11px;color:#888">❤️ +${t.pts}${t.rwd>0?' · ₩'+t.rwd.toLocaleString():''}</span>
        <button class="btn-h" onclick="event.stopPropagation();alert('已接单')">✋ 帮助</button>
      </div>
    </div>
  `).join('');
  document.getElementById('tc').textContent=tasks.length;
}
function checkAuth(){
  var a=localStorage.getItem('hc_auth');
  var el=document.getElementById('authArea');
  if(a){
    try{var u=JSON.parse(a).user;
      el.innerHTML=`<button class="avatar" onclick="alert('用户菜单')">${(u.name||'U').charAt(0)}</button>`;
      document.getElementById('achPoints').textContent='2,400';
      document.getElementById('achStats').style.display='flex';
      document.getElementById('stHelps').textContent='12';
      document.getElementById('stPts').textContent='2,400';
    }catch(e){showLogin();}
  }else{
    el.innerHTML=`<a href="/auth/register.html" class="btn-log">登录</a>`;
    document.getElementById('achPoints').textContent='—';
  }
}
renderT();checkAuth();
</script>
</body>
</html>
