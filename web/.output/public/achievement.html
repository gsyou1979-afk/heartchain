<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7B1FA2">
<title>成就 - HeartChain</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#FAF5FF;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#1A1A2E,#16213E);padding:16px;color:#fff}
.back{color:#fff;text-decoration:none;font-size:16px}
.title{font-size:17px;font-weight:600;margin-left:12px}
.hero{text-align:center;padding:32px 0}
.hero-label{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:4px}
.hero-num{font-size:48px;font-weight:800;color:#fff}
.hero-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}
.hero-stats{display:flex;justify-content:center;gap:32px;margin-top:20px}
.hero-stat{text-align:center}
.hero-stat .num{font-size:24px;font-weight:700;color:#fff}
.hero-stat .label{font-size:11px;color:rgba(255,255,255,.5)}
.content{padding:0 16px 32px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.level-label{font-size:12px;color:#888;margin-bottom:8px}
.level-name{font-size:13px;font-weight:700;color:#7B1FA2}
.progress-bar{background:#f0f0f0;border-radius:10px;height:10px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#7B1FA2,#AB47BC);transition:width .5s}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:#999}
.section-title{font-size:13px;font-weight:600;color:#333;margin-bottom:12px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge{text-align:center}
.badge-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 6px}
.badge-icon.unlocked{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.badge-icon.locked{opacity:.3;filter:grayscale(1)}
.badge-name{font-size:10px;color:#666;line-height:1.3}
.stat-grid{display:flex;gap:12px}
.stat-item{flex:1;border-radius:12px;padding:12px;text-align:center}
.stat-item.green{background:#E8F5E9}
.stat-item.purple{background:#F3E5F5}
.stat-item.yellow{background:#FFF8E1}
.stat-item .num{font-size:20px;font-weight:700}
.stat-item.green .num{color:#4CAF50}
.stat-item.purple .num{color:#7B1FA2}
.stat-item.yellow .num{color:#FFB300}
.stat-item .label{font-size:11px;color:#888;margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back">←</a>
  <span class="title">🏆 我的成就</span>
</div>
<div class="hero">
  <div class="hero-label">累计爱心积分</div>
  <div class="hero-num">12,400</div>
  <div class="hero-sub">❤️ Heart Points</div>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">36</div><div class="label">总帮助</div></div>
    <div class="hero-stat"><div class="num">12</div><div class="label">本月</div></div>
    <div class="hero-stat"><div class="num">#3</div><div class="label">排名</div></div>
  </div>
</div>

<div class="content">
  <!-- 等级 -->
  <div class="card">
    <div class="level-label">会员等级</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="level-name">Lv.3 热心市民</span>
      <span style="font-size:12px;color:#888">Lv.4 爱心使者</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
    <div class="progress-labels"><span>当前 12,400</span><span>下一级 20,000</span></div>
  </div>

  <!-- 徽章 -->
  <div class="card">
    <div class="section-title">🏅 成就徽章</div>
    <div class="badge-grid">
      <div class="badge"><div class="badge-icon unlocked" style="background:linear-gradient(135deg,#FFD700,#FFA000)">🌟</div><div class="badge-name">首次帮助</div></div>
      <div class="badge"><div class="badge-icon unlocked" style="background:linear-gradient(135deg,#4CAF50,#8BC34A)">🌱</div><div class="badge-name">连续7天</div></div>
      <div class="badge"><div class="badge-icon unlocked" style="background:linear-gradient(135deg,#2196F3,#03A9F4)">💎</div><div class="badge-name">帮助10次</div></div>
      <div class="badge"><div class="badge-icon unlocked" style="background:linear-gradient(135deg,#E91E63,#F06292)">❤️</div><div class="badge-name">爱心大使</div></div>
      <div class="badge"><div class="badge-icon unlocked" style="background:linear-gradient(135deg,#9C27B0,#BA68C8)">🔥</div><div class="badge-name">月度Top10</div></div>
      <div class="badge"><div class="badge-icon unlocked" style="background:linear-gradient(135deg,#FF5722,#FF8A65)">⚡</div><div class="badge-name">闪电响应</div></div>
      <div class="badge"><div class="badge-icon locked" style="background:#e0e0e0">🔒</div><div class="badge-name">???</div></div>
      <div class="badge"><div class="badge-icon locked" style="background:#e0e0e0">🔒</div><div class="badge-name">???</div></div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="card">
    <div class="section-title">📊 本月统计</div>
    <div class="stat-grid">
      <div class="stat-item green"><div class="num">12</div><div class="label">帮助次数</div></div>
      <div class="stat-item purple"><div class="num">2,400</div><div class="label">获得积分</div></div>
      <div class="stat-item yellow"><div class="num">4.9</div><div class="label">平均评分</div></div>
    </div>
  </div>
</div>
</body>
</html>
